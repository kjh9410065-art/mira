name: Mira bottom clean

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Remove footer content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          # 하단에 추가된 법적/사이트 푸터와 전용 스타일을 제거해 아래 영역을 빈 공간으로 유지한다.
          html = re.sub(r'<style>\s*/\* MIRA_LEGAL_FOOTER \*/.*?</style>', '', html, flags=re.S)
          html = re.sub(r'<footer class="mira-legal-footer">.*?</footer>', '', html, flags=re.S)
          html = re.sub(r'<div class="flick-site-footer-info">.*?</div>', '', html, flags=re.S)
          html = re.sub(r'<style>\s*/\* FLICK_SITE_FOOTER \*/.*?</style>', '', html, flags=re.S)
          # 일반 footer가 남아 있더라도 하단 표시만 제거한다.
          html = re.sub(r'<footer[^>]*>.*?</footer>', '', html, flags=re.S|re.I)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/one-time-bottom-clean.yml
          if git diff --cached --quiet; then
            git commit -m "Keep Mira site bottom blank"
          else
            git commit -m "Keep Mira site bottom blank"
          fi
          git push