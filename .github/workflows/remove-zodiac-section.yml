name: Mira remove zodiac section

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Hide zodiac area permanently
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = '</head>'
          patch = '''<style id="mira-remove-zodiac">\n/* 홈 화면에서 띠·별자리 영역을 사용하지 않습니다. */\n.zodiac-box,.z-detail{display:none!important}\n</style>'''
          if 'id="mira-remove-zodiac"' not in html:
              if marker not in html:
                  raise SystemExit('head marker not found')
              html = html.replace(marker, patch + marker, 1)
          html = html.replace('<a href="#zodiac"><span class="ico">◈</span>띠 운세</a>', '')
          html = html.replace('<a href="#zodiac"><span class="ico">✦</span>별자리 운세</a>', '')
          html = html.replace('<a href="#zodiac">띠·별자리</a>', '')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-zodiac-section.yml
          git commit -m "Mira 띠별 별자리 영역 제거"
          git push
