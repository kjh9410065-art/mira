name: Mira remove zodiac section

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Remove zodiac section and modal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # 중첩된 div가 많아도 정확히 영역의 시작/다음 영역 경계로 제거한다.
          start = '<div id="zodiac" class="zodiac-box">'
          end = '<div class="z-detail" id="zDetail"'
          a = html.find(start)
          b = html.find(end, a + len(start)) if a >= 0 else -1
          if a < 0 or b < 0:
              raise SystemExit('zodiac section boundary not found')
          html = html[:a] + html[b:]

          # 상세 모달부터 테스트 영역 시작 직전까지 제거한다.
          a = html.find(end)
          b = html.find('<section id="tests">', a + len(end)) if a >= 0 else -1
          if a < 0 or b < 0:
              raise SystemExit('zodiac modal boundary not found')
          html = html[:a] + html[b:]

          # 더 이상 존재하지 않는 띠·별자리 메뉴 링크도 제거한다.
          html = html.replace('<a href="#zodiac"><span class="ico">◈</span>띠 운세</a>', '')
          html = html.replace('<a href="#zodiac"><span class="ico">✦</span>별자리 운세</a>', '')
          html = html.replace('<a href="#zodiac">띠·별자리</a>', '')

          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-zodiac-section.yml
          git commit -m "Mira 띠별 별자리 영역 제거"
          git push
