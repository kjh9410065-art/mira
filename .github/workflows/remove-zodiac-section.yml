name: Mira remove zodiac section

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Remove zodiac section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # 띠·별자리 영역부터 심리테스트 영역 시작 전까지 한 번에 제거한다.
          pattern = r'<div id="zodiac".*?<section id="tests">'
          cleaned, count = re.subn(pattern, '<section id="tests">', html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('zodiac area not found')

          # 상단 메뉴에서도 더 이상 존재하지 않는 링크를 제거한다.
          cleaned = cleaned.replace('<a href="#zodiac"><span class="ico">◈</span>띠 운세</a>', '')
          cleaned = cleaned.replace('<a href="#zodiac"><span class="ico">✦</span>별자리 운세</a>', '')
          cleaned = cleaned.replace('<a href="#zodiac">띠·별자리</a>', '')

          p.write_text(cleaned, encoding='utf-8')
          PY
      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-zodiac-section.yml
          git commit -m "Mira 띠별 별자리 영역 제거"
          git push
