name: Fix birth form layout v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch birth form positions
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/zodiac-links.js')
          text = p.read_text(encoding='utf-8')
          marker = '/* MIRA_BIRTH_FORM_LAYOUT_V2 */'
          if marker in text:
              raise SystemExit(0)
          patch = r'''\n\n/* MIRA_BIRTH_FORM_LAYOUT_V2 */\n(function(){\n  // 날짜 선택/확인/초기화를 한 줄의 고정 슬롯으로 만들고 경고문은 왼쪽에 겹쳐 표시합니다.\n  const s=document.createElement('style');\n  s.textContent=`\n    .birth-box{position:relative!important;}\n    .birth-form{position:absolute!important;right:14px!important;top:50%!important;transform:translateY(-50%)!important;width:335px!important;min-width:335px!important;height:48px!important;display:flex!important;align-items:center!important;flex-wrap:nowrap!important;gap:7px!important;margin:0!important;padding:0!important;}\n    .birth-form .birth-date-trigger{width:230px!important;min-width:230px!important;max-width:230px!important;flex:0 0 230px!important;}\n    .birth-form .birth-reset{width:64px!important;min-width:64px!important;height:38px!important;flex:0 0 64px!important;}\n    .birth-result{display:none!important;}\n    .birth-result.birth-warning{display:block!important;position:absolute!important;z-index:100000!important;left:auto!important;right:calc(100% + 10px)!important;top:50%!important;transform:translateY(-50%)!important;width:max-content!important;max-width:none!important;margin:0!important;white-space:nowrap!important;pointer-events:none!important;}\n    @media(max-width:760px) and (hover:none) and (pointer:coarse){\n      .birth-box{min-height:76px!important;padding:14px!important;overflow:visible!important;}\n      .birth-copy{display:none!important;}\n      .birth-form{left:14px!important;right:auto!important;top:50%!important;transform:translateY(-50%)!important;width:335px!important;min-width:335px!important;max-width:335px!important;}\n      .birth-result.birth-warning{right:calc(100% + 10px)!important;left:auto!important;}\n    }`;\n  document.head.appendChild(s);\n\n  // 기존 스크립트가 정상 결과를 birth-result에 넣어도 화면에는 표시하지 않습니다.\n  // 경고가 뜰 때만 birth-result를 birth-form 왼쪽에 노출합니다.\n  const observer=new MutationObserver(()=>{\n    const form=document.getElementById('birthForm');\n    const result=document.getElementById('birthResult');\n    if(!form||!result)return;\n    if(result.classList.contains('birth-warning')){\n      const box=form.closest('.birth-box');\n      if(box && result.parentElement!==box)box.appendChild(result);\n      result.style.position='absolute';\n      result.style.left='auto';\n      result.style.right='calc(100% + 10px)';\n      result.style.top='50%';\n      result.style.bottom='auto';\n      result.style.transform='translateY(-50%)';\n      result.style.width='max-content';\n      result.style.margin='0';\n      result.style.display='block';\n      result.style.pointerEvents='none';\n    }\n  });\n  observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style']});\n})();\n'''
          p.write_text(text + patch, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/zodiac-links.js
          git diff --cached --quiet || (git commit -m 'fix: place reset after fortune button and warning left' && git push)
