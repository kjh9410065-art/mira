name: Fix birth form layout v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch birth form positions
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/zodiac-links.js')
          text = p.read_text(encoding='utf-8')
          marker = '/* MIRA_BIRTH_FORM_LAYOUT_V3 */'
          if marker in text:
              raise SystemExit(0)
          patch = r'''

/* MIRA_BIRTH_FORM_LAYOUT_V3 */
(function(){
  // 출생년도/띠 표시와 경고문을 입력창 왼쪽의 고정 슬롯에 배치합니다.
  const s=document.createElement('style');
  s.textContent=`
    .birth-box{position:relative!important;}
    .birth-form{position:absolute!important;right:14px!important;top:50%!important;transform:translateY(-50%)!important;width:430px!important;min-width:430px!important;height:48px!important;display:flex!important;align-items:center!important;flex-wrap:nowrap!important;gap:7px!important;margin:0!important;padding:0!important;}
    .birth-form .birth-result{order:1!important;position:static!important;display:block!important;width:116px!important;min-width:116px!important;max-width:116px!important;margin:0!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;text-align:right!important;font-size:11px!important;font-weight:800!important;color:#5c8d71!important;}
    .birth-form .birth-date-trigger{order:2!important;width:230px!important;min-width:230px!important;max-width:230px!important;flex:0 0 230px!important;}
    .birth-form button[type="submit"]{order:3!important;flex:0 0 auto!important;}
    .birth-form .birth-reset{order:4!important;width:64px!important;min-width:64px!important;height:38px!important;flex:0 0 64px!important;}
    .birth-form .birth-result.birth-warning{position:static!important;display:block!important;width:116px!important;min-width:116px!important;max-width:116px!important;margin:0!important;white-space:nowrap!important;overflow:visible!important;text-overflow:clip!important;text-align:right!important;pointer-events:none!important;color:#a15b4c!important;}
    @media(max-width:760px) and (hover:none) and (pointer:coarse){
      .birth-box{min-height:76px!important;padding:14px!important;overflow:visible!important;}
      .birth-copy{display:none!important;}
      .birth-form{left:14px!important;right:auto!important;top:50%!important;transform:translateY(-50%)!important;width:430px!important;min-width:430px!important;max-width:430px!important;}
    }`;
  document.head.appendChild(s);

  const form=document.getElementById('birthForm');
  const result=document.getElementById('birthResult');
  const trigger=form&&form.querySelector('.birth-date-trigger');
  if(form&&result&&trigger){
    // 결과/경고 요소를 실제 DOM에서도 입력창 앞에 놓아 CSS 순서가 확실하게 적용되도록 합니다.
    form.insertBefore(result,trigger);
    result.classList.remove('birth-warning');
  }
})();
'''
          p.write_text(text + patch, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/zodiac-links.js
          git diff --cached --quiet || (git commit -m 'fix: move birth result to left of date field' && git push)
