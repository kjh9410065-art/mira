name: Mira force empty cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Add final pre-input lock to homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = 'MIRA_PRE_INPUT_LOCK'
          if marker not in html:
              css = '''<style id="mira-pre-input-lock">\n/* MIRA_PRE_INPUT_LOCK: 입력 전 운세 카드 내용은 항상 빈칸 */\nbody.mira-pre-input-lock .overview .four .fortune > *{visibility:hidden!important;opacity:0!important}\nbody.mira-pre-input-lock .overview .four .fortune{min-height:91px!important}\n</style>'''
              js = '''<script id="mira-pre-input-lock-script">\n/* MIRA_PRE_INPUT_LOCK: 실제 운세 확인을 누르기 전까지 하단 4개 카드를 강제로 비운다. */\n(function(){\n  function lock(){document.body.classList.add('mira-pre-input-lock');}\n  function unlock(){document.body.classList.remove('mira-pre-input-lock');}\n  function ready(){\n    lock();\n    const form=document.getElementById('birthForm');\n    if(!form)return;\n    form.addEventListener('submit',function(){\n      setTimeout(function(){\n        const overview=document.querySelector('.overview');\n        if(overview && overview.classList.contains('mira-ready')) unlock();\n        else lock();\n      },200);\n    },true);\n    form.addEventListener('click',function(e){\n      const reset=e.target.closest('.birth-reset');\n      if(reset) lock();\n    },true);\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready,{once:true});\n  else ready();\n})();\n</script>'''
              html = html.replace('</head>', css + '</head>', 1)
              html = html.replace('</body>', js + '</body>', 1)
              p.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/force-empty-cards.yml
          git commit -m "Force fortune cards blank until confirmation"
          git push