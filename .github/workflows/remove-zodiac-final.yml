name: Mira remove zodiac final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove:
    if: github.event.commits[0].message != 'Mira 띠·별자리 영역 완전 제거'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove zodiac UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # 띠·별자리 영역을 시작 태그부터 다음 상세 모달 또는 테스트 영역까지 제거한다.
          start = html.find('<div id="zodiac" class="zodiac-box">')
          if start >= 0:
              end = html.find('<div class="z-detail" id="zDetail"', start)
              if end < 0:
                  end = html.find('<section id="tests">', start)
              if end < 0:
                  raise SystemExit('zodiac end boundary not found')
              html = html[:start] + html[end:]

          # 상세 모달이 남아 있으면 테스트 영역 직전까지 제거한다.
          start = html.find('<div class="z-detail" id="zDetail"')
          if start >= 0:
              end = html.find('<section id="tests">', start)
              if end < 0:
                  raise SystemExit('zodiac modal end boundary not found')
              html = html[:start] + html[end:]

          # 띠·별자리 관련 메뉴 링크를 모두 제거한다.
          html = re.sub(r'<a href="#zodiac">.*?</a>', '', html)
          p.write_text(html, encoding='utf-8')

          # 최종 검증: 해당 UI가 HTML에 존재하면 실패시킨다.
          check = p.read_text(encoding='utf-8')
          forbidden = ['id="zodiac"', '띠·별자리 오늘운', '12띠', '12별자리']
          if any(x in check for x in forbidden):
              raise SystemExit('zodiac UI still remains after cleanup')
          PY
      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-zodiac-final.yml
          git commit -m "Mira 띠·별자리 영역 완전 제거"
          git push
