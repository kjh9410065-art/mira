name: Mira remove zodiac final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove:
    if: github.event.commits[0].message != 'Mira 띠·별자리 영역 완전 제거'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Hide and detach zodiac UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # 띠·별자리 영역은 공간까지 남기지 않도록 display:none으로 완전히 제거한다.
          style = '<style id="mira-remove-zodiac">.zodiac-box,.z-detail{display:none!important}</style>'
          if 'id="mira-remove-zodiac"' not in html:
              html = html.replace('</head>', style + '</head>', 1)

          # 메뉴에서 띠·별자리 링크를 제거한다.
          html = re.sub(r'<a href="#zodiac">.*?</a>', '', html)
          p.write_text(html, encoding='utf-8')

          # 실제 파일에 제거용 스타일이 존재하는지 검증한다.
          check = p.read_text(encoding='utf-8')
          if 'id="mira-remove-zodiac"' not in check:
              raise SystemExit('remove style was not inserted')
          PY
      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-zodiac-final.yml
          git commit -m "Mira 띠·별자리 영역 완전 제거"
          git push
