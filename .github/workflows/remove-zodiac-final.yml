name: Mira remove zodiac final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove:
    if: github.event.commits[0].message != 'Mira 띠·별자리 영역 완전 제거'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove zodiac block and links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # 띠·별자리 영역 시작부터 상세 모달 시작 직전까지 제거한다.
          pattern = r'<div id="zodiac" class="zodiac-box">.*?(?=<div class="z-detail" id="zDetail")'
          html, count = re.subn(pattern, '', html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('zodiac box not found')

          # 상세 모달부터 심리테스트 영역 시작 직전까지 제거한다.
          pattern = r'<div class="z-detail" id="zDetail".*?(?=<section id="tests">)'
          html, count = re.subn(pattern, '', html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('zodiac detail not found')

          # 상단/사이드 메뉴의 띠·별자리 링크를 제거한다.
          html = re.sub(r'<a href="#zodiac">.*?</a>', '', html)
          p.write_text(html, encoding='utf-8')

          # 실제 파일에 관련 UI가 남지 않았는지 검증한다.
          check = p.read_text(encoding='utf-8')
          forbidden = ['id="zodiac"', '띠·별자리 오늘운', '12띠', '12별자리']
          if any(x in check for x in forbidden):
              raise SystemExit('zodiac UI still remains after cleanup')
          PY
      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-zodiac-final.yml
          git commit -m "Mira 띠·별자리 영역 완전 제거"
          git push
