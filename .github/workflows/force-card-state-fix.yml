name: Fix Mira card state

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix pre-input lock and fortune cards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/zodiac-links.js')
          s = p.read_text(encoding='utf-8')

          # 입력 전 잠금은 유지하되, 운세 확인 직후에는 반드시 해제합니다.
          old = "o.classList.remove('mira-pending');o.classList.add('mira-ready');"
          new = "o.classList.remove('mira-pending');o.classList.add('mira-ready');document.body.classList.remove('mira-pre-input-lock');"
          if old not in s:
              raise SystemExit('show state target not found')
          s = s.replace(old, new, 1)

          # 초기화/미입력 상태에서는 다시 잠급니다.
          old2 = "const o=document.querySelector('.overview');if(!o)return;o.classList.remove('mira-ready');o.classList.add('mira-pending');"
          new2 = "const o=document.querySelector('.overview');if(!o)return;document.body.classList.add('mira-pre-input-lock');o.classList.remove('mira-ready');o.classList.add('mira-pending');"
          if old2 not in s:
              raise SystemExit('pending state target not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/zodiac-links.js .github/workflows/force-card-state-fix.yml
          git commit -m "운세 확인 시 하단 카드 잠금 해제 수정"
          git rm .github/workflows/force-card-state-fix.yml
          git commit -m "Remove temporary card state workflow"
          git push
