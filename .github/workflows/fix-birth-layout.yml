name: Fix birth form layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixed birth form layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/zodiac-links.js')
          text = p.read_text(encoding='utf-8')
          marker = '/* MIRA_BIRTH_FORM_FIXED_LAYOUT */'
          if marker not in text:
              patch = r'''\n\n// MIRA_BIRTH_FORM_FIXED_LAYOUT\n(function(){\n  // 생년월일 입력창과 버튼을 고정 슬롯으로 배치해 경고문이 레이아웃을 밀지 못하게 합니다.\n  const s=document.createElement('style');\n  s.textContent=`\n  .birth-box{position:relative!important;}\n  .birth-form{position:absolute!important;right:17px!important;top:50%!important;transform:translateY(-50%)!important;width:335px!important;min-width:335px!important;max-width:335px!important;display:flex!important;flex-wrap:nowrap!important;align-items:center!important;gap:7px!important;margin:0!important;}\n  .birth-form .birth-date-trigger{flex:0 0 230px!important;width:230px!important;min-width:230px!important;}\n  .birth-form button{flex:0 0 auto!important;}\n  .birth-result{position:fixed!important;}\n  @media(max-width:760px) and (hover:none) and (pointer:coarse){\n    .birth-box{min-height:76px!important;padding:14px!important;overflow:visible!important;}\n    .birth-copy{display:none!important;}\n    .birth-form{left:14px!important;right:auto!important;top:50%!important;width:335px!important;min-width:335px!important;max-width:335px!important;transform:translateY(-50%)!important;}\n  }`;\n  document.head.appendChild(s);\n})();\n'''
              p.write_text(text + patch, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/zodiac-links.js
          git diff --cached --quiet || (git commit -m 'fix: lock birth date form position' && git push)
