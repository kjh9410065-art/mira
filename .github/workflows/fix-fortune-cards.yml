name: Fix Mira Fortune Cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fortune card rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/zodiac-links.js')
          s = p.read_text(encoding='utf-8')
          old = """    o.querySelectorAll('.four .fortune').forEach((c,n)=>{const scores=[f.scores.money,f.scores.love,f.scores.work,f.scores.health],titles=[f.level(scores[0]),f.level(scores[1]),f.level(scores[2]),f.level(scores[3])],texts=[f.moneyText,f.loveText,f.workText,f.healthText];const s=c.querySelector('strong'),p=c.querySelector('small'),score=c.querySelector('.score b');if(s){s.textContent=scores[n]+'점';s.style.removeProperty('display');}if(p){p.textContent=texts[n];p.style.removeProperty('display');}if(score){score.textContent=scores[n];score.style.removeProperty('display');}});"""
          new = """    o.querySelectorAll('.four .fortune').forEach((c,n)=>{const scores=[f.scores.money,f.scores.love,f.scores.work,f.scores.health],texts=[f.moneyText,f.loveText,f.workText,f.healthText];if(n>3)return;c.querySelectorAll('[data-mira-fortune]').forEach(el=>el.remove());const s=document.createElement('strong');s.dataset.miraFortune='score';s.textContent=scores[n]+'점';const p=document.createElement('small');p.dataset.miraFortune='text';p.textContent=texts[n];c.appendChild(s);c.appendChild(p);});"""
          if old not in s:
              raise SystemExit('target show() block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/zodiac-links.js .github/workflows/fix-fortune-cards.yml
          git commit -m "운세 확인 후 하단 운세 카드 표시 수정"
          git rm .github/workflows/fix-fortune-cards.yml
          git commit -m "Remove temporary Mira fortune card workflow"
          git push
