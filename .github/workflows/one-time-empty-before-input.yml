name: Mira empty cards before input

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Hide fortune card content until birth date is entered
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/zodiac-links.js')
          js = p.read_text(encoding='utf-8')
          old = '.overview.mira-pending .four .fortune>*{visibility:hidden!important;opacity:0!important}.overview.mira-pending .four .fortune h3{visibility:visible!important;opacity:1!important}'
          new = '.overview.mira-pending .four .fortune>*{visibility:hidden!important;opacity:0!important}.overview.mira-pending .four .fortune h3{visibility:hidden!important;opacity:0!important}.overview:not(.mira-ready) .four .fortune>*{visibility:hidden!important;opacity:0!important}'
          if old in js:
              js = js.replace(old, new, 1)
          elif '.overview:not(.mira-ready) .four .fortune>*' not in js:
              marker = '.overview.mira-pending .four .fortune>*{visibility:hidden!important;opacity:0!important}'
              js = js.replace(marker, marker + '.overview:not(.mira-ready) .four .fortune>*{visibility:hidden!important;opacity:0!important}', 1)
          p.write_text(js, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/zodiac-links.js
          git rm .github/workflows/one-time-empty-before-input.yml
          git commit -m "Keep fortune cards blank before birth date input"
          git push